[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel: AI Security Gateway for Agentic Commerce"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.115.0",
    "uvicorn~=0.30.0",
    "pydantic~=2.8.0",
    "transformers~=4.44.0",
    "torch>=2.2.0",
    "httpx~=0.27.2",
    "pypdf~=4.3.0",
    "streamlit~=1.38.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = [
    "pytest~=8.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]